<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>Password help | DEVPAGES</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"></head><body><main class="auth-shell"><div class="auth-wrap"><a class="auth-brand" href="/"><img src="/assets/devpages-logo.png" alt="DEVPAGES"></a><section class="auth-panel"><div class="auth-kicker">ACCOUNT RECOVERY</div><h1>Reset your <span>password.</span></h1><p class="auth-copy" id="reset-copy">Enter your account email and we will send a password reset link.</p><form class="auth-form" id="reset-form"><div class="auth-field" id="reset-email-field"><label for="email">EMAIL ADDRESS</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-field" id="new-password-field" hidden><label for="new-password">NEW PASSWORD</label><input id="new-password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div><button class="auth-submit" id="reset-submit" type="submit">Send reset link <span aria-hidden="true">→</span></button></form><div class="auth-message" id="auth-message" role="status" aria-live="polite"></div><div class="auth-links"><a href="/login.html">Back to sign in</a><a href="/">DEVPAGES home</a></div></section></div></main><script type="module" src="/account-auth.js"></script></body></html>
